<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel Slides – ReadNovaHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.sub {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(168,85,247,0.15);
    }
    .card img {
      width: 100%;
      display: block;
    }
    .card .label {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card .label span {
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .card .label a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .card .label a:hover { opacity: 0.85; }
    footer {
      text-align: center;
      margin-top: 36px;
      color: #475569;
      font-size: 0.8rem;
    }
    footer a { color: #7c3aed; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🎬 CapCut Reel Slides</h1>
  <p class="sub">Long-press each image on mobile → Save to Photos, then import into CapCut</p>

  <div class="grid">
    <div class="card">
      <img src="/slide1.jpg" alt="Slide 1 – Still Broke After College?" loading="lazy" />
      <div class="label">
        <span>Slide 1 – Dramatic Opener</span>
        <a href="/slide1.jpg" download="slide1.jpg">⬇ Save</a>
      </div>
    </div>

    <div class="card">
      <img src="/slide2.jpg" alt="Slide 2 – AI Tools" loading="lazy" />
      <div class="label">
        <span>Slide 2 – AI Tools Reveal</span>
        <a href="/slide2.jpg" download="slide2.jpg">⬇ Save</a>
      </div>
    </div>

    <div class="card">
      <img src="/slide3.jpg" alt="Slide 3 – Book Cover" loading="lazy" />
      <div class="label">
        <span>Slide 3 – Book Hero</span>
        <a href="/slide3.jpg" download="slide3.jpg">⬇ Save</a>
      </div>
    </div>

    <div class="card">
      <img src="/slide4.jpg" alt="Slide 4 – Income Slide" loading="lazy" />
      <div class="label">
        <span>Slide 4 – ₹15K–₹35K/Month</span>
        <a href="/slide4.jpg" download="slide4.jpg">⬇ Save</a>
      </div>
    </div>

    <div class="card">
      <img src="/slide5.jpg" alt="Slide 5 – CTA" loading="lazy" />
      <div class="label">
        <span>Slide 5 – Get It for ₹299 🔥</span>
        <a href="/slide5.jpg" download="slide5.jpg">⬇ Save</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Made with ❤️ for <a href="https://student-ai-playbook.vercel.app">@readnovahub</a></p>
  </footer>
</body>
</html>
